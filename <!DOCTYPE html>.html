<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats Section</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

.stats-section {
    position: relative;
    background-image: url('bg-image.jpg'); /* Replace with your background image */
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    width: 100%;
    height: 420px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: #0f313a;
    opacity: 0.8;
}

.container {
    position: relative;
    width: 90%;
    max-width: 1200px;
}

.stats-grid {
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    text-align: center;
}

.stat-box {
    color: white;
    padding: 20px;
    z-index: 1;
    width: 236px;
}

.icon-box {
    width: 80px;
    height: 75px;
    background: #f94735;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 15px;
    border-radius: 10px;
}

.icon-box i {
    font-size: 30px;
    color: white;
}

.counter {
    font-size: 40px;
    font-weight: bold;
    margin-bottom: 5px;
}

/* Responsive */
@media (max-width: 768px) {
    .stats-section {
        height: auto;
        padding: 50px 0;
    }

    .stats-grid {
        flex-direction: column;
        align-items: center;
    }

    .stat-box {
        margin-bottom: 20px;
    }

    .counter {
        font-size: 30px;
    }
}

</style>
<body>
    <section class="stats-section">
        <div class="overlay"></div>
        <div class="container">
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="icon-box">
                        <i class="fas fa-thumbs-up"></i>
                    </div>
                    <h2 class="counter" data-target="31">0</h2>
                    <p>Years of Experience</p>
                </div>

                <div class="stat-box">
                    <div class="icon-box">
                        <i class="fas fa-globe"></i>
                    </div>
                    <h2 class="counter" data-target="573">0</h2>
                    <p>Cities Served Worldwide</p>
                </div>

                <div class="stat-box">
                    <div class="icon-box">
                        <i class="fas fa-users"></i>
                    </div>
                    <h2 class="counter" data-target="426">0</h2>
                    <p>Satisfied Clients</p>
                </div>

                <div class="stat-box">
                    <div class="icon-box">
                        <i class="fas fa-handshake"></i>
                    </div>
                    <h2 class="counter" data-target="40">0</h2>
                    <p>Company We Help</p>
                </div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
    const counters = document.querySelectorAll(".counter");

    counters.forEach((counter) => {
        counter.innerText = "0";
        const updateCounter = () => {
            const target = +counter.getAttribute("data-target");
            const count = +counter.innerText;
            const increment = target / 100;

            if (count < target) {
                counter.innerText = `${Math.ceil(count + increment)}`;
                setTimeout(updateCounter, 20);
            } else {
                counter.innerText = target;
            }
        };

        updateCounter();
    });
});

    </script>
</body>
</html>
