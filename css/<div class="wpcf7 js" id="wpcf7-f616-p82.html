<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responsive Navbar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Poppins:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/media.css">
  <style>
    * {
  margin: 0;
  padding: 0;
  font-family: 'Plus Jakarta Sans', sans-serif;
}

.navbar-brand img {
  max-height: 63px;
  transition-duration: 0.5s;
}

.navbar-nav .nav-item a {
  color: white;
}

.navbar-nav .nav-link.active,
.navbar-nav .nav-link.show {
  color: #f94735;
}

.dropdown-menu a.dropdown-item {
  font-size: 17px;
  font-weight: 500;
  color: black !important;
}

.dropdown-menu a.dropdown-item.active {
  color: #f94735 !important;
  background-color: #fff !important;
}

.dropdown-menu li {
  padding: 8px;
  position: relative;
}

ul.dropdown-menu li ul.dropdown-menu {
  display: none;
  position: absolute;
  left: 100%;
  top: 0;
}

ul.dropdown-menu li:hover > ul.dropdown-menu {
  display: block;
}

.nav-item.dropdown:hover .dropdown-menu {
  display: block;
  margin-top: 0;
}

  </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">Navbar</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse col-6 col-lg-6" id="navbarNav">
            <ul class="navbar-nav me-auto gap-4">
              <!-- Repeat for other nav items as necessary -->
              <li class="nav-item dropdown">
                <a class="nav-link text-uppercase downarrow fw-bolder" href="#" id="navbarDropdownHome" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                  Home
                </a>
                <ul class="dropdown-menu" aria-labelledby="navbarDropdownHome">
                  <li><a class="dropdown-item active" href="#">Home 01</a></li>
                  <li><a class="dropdown-item" href="#">Home 02 - Dark Menu</a></li>
                  <li><a class="dropdown-item" href="#">Home 03</a></li>
                </ul>
              </li>
              <!-- More dropdown items -->
            </ul>
          </div>
        </div>
      </nav>
      
      <script>
        document.querySelectorAll('.navbar-nav .dropdown').forEach(function(dropdown) {
          if (window.matchMedia('(min-width: 992px)').matches) {
            dropdown.addEventListener('mouseover', function() {
              const menu = dropdown.querySelector('.dropdown-menu');
              menu.classList.add('show');
            });
            dropdown.addEventListener('mouseout', function() {
              const menu = dropdown.querySelector('.dropdown-menu');
              menu.classList.remove('show');
            });
          }
          dropdown.querySelector('a').addEventListener('click', function(e) {
            if (window.matchMedia('(max-width: 991px)').matches) {
              e.preventDefault();
              const menu = dropdown.querySelector('.dropdown-menu');
              menu.classList.toggle('show');
            }
          });
        });
      </script>
      
</body>
</html>
