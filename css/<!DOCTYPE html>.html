<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testimonial Slider</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .slider-container {
            width: 100%;
            max-width: 600px;
            overflow: hidden;
            background: #f8f8f8;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 300px;
            margin: auto;
        }

        .slides {
            display: flex;
            transition: transform 0.5s ease-in-out;
        }

        .slide {
            min-width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            background: white;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-right: 15px;
        }

        .text {
            max-width: 250px;
        }

        .prev, .next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
        }

        .prev { left: 10px; }
        .next { right: 10px; }
    </style>
</head>
<body>

<div class="slider-container">
    <button class="prev" onclick="moveSlide(-1)">&#10094;</button>
    <div class="slides">
        <div class="slide">
            <img class="avatar" src="https://via.placeholder.com/80" alt="User Image">
            <div class="text">
                <p>"It fits our needs perfectly. I am completely blown away."</p>
                <strong>DENNIS BULGER</strong><br>
                <span>CREW SUPERVISOR</span>
            </div>
        </div>
        <div class="slide">
            <img class="avatar" src="https://via.placeholder.com/80" alt="User Image">
            <div class="text">
                <p>"I love your system. I have gotten at least 50 times the value from cargo."</p>
                <strong>JOHN HORROCKS</strong><br>
                <span>LOADMASTER</span>
            </div>
        </div>
        <div class="slide">
            <img class="avatar" src="https://via.placeholder.com/80" alt="User Image">
            <div class="text">
                <p>"We have no regrets! I will recommend you to my colleagues."</p>
                <strong>JOHN DOE</strong><br>
                <span>MANAGER</span>
            </div>
        </div>
    </div>
    <button class="next" onclick="moveSlide(1)">&#10095;</button>
</div>

<script>
    let currentIndex = 0;
    const slides = document.querySelector('.slides');
    const totalSlides = document.querySelectorAll('.slide').length;

    function moveSlide(step) {
        currentIndex = (currentIndex + step + totalSlides) % totalSlides;
        updateSlidePosition();
    }

    function updateSlidePosition() {
        slides.style.transform = `translateX(-${currentIndex * 100}%)`;
    }

    function autoSlide() {
        moveSlide(1);
    }

    setInterval(autoSlide, 3000); // Auto slide every 3 seconds
</script>

</body>
</html>
